<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITEMS | {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="app-shell">
    <main class="content-area error-page-content">
        <div class="error-state card">
            <div class="error-state-code">{{ code }}</div>
            <div class="catalog-kicker">Request status</div>
            <h1>{{ title }}</h1>
            <p class="text-muted">{{ message }}</p>
            <div class="action-row"><a class="btn btn-cancel" href="{{ url_for('index') }}">Back home</a><a class="btn btn-confirm" href="{{ url_for('login') }}">Sign in</a></div>
        </div>
    </main>
</body>
</html>

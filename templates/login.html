<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITEMS Login - Mabalacat City College</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
<!-- Header -->
<header class="login-header">
<div class="login-header-content">
<div class="login-brand-header">
<img src="{{ url_for('static', filename='images/mcc-logo.png') }}" alt="Mabalacat City College Logo" class="logo-small">
<div class="brand-text">
<h1>MABALACAT CITY COLLEGE</h1>
<p>ITEMS - Equipment Inventory Management</p>
</div>
</div>
</div>
</header>

<!-- Main Content -->
<main class="login-container">
<div class="login-form-box">
<h2 class="mb-4">Sign In</h2>
{% with messages=get_flashed_messages(with_categories=true) %}
{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}
{% endwith %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3">
<label class="form-label" for="username">Username</label>
<input class="form-control" id="username" name="username" autocomplete="username" required>
</div>
<div class="mb-4">
<label class="form-label" for="password">Password</label>
<input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button class="btn btn-login w-100" type="submit">Sign In</button>
</form>
</div>
</main>
</body>
</html>

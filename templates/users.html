{% extends "base.html" %}{% block content %}
<h2 class="fw-bold mb-4">Users</h2>
<div class="card shadow-sm mb-3"><div class="card-body"><form method="post" action="{{url_for('add_user')}}" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-2"><input class="form-control" name="username" placeholder="Username" required></div>
<div class="col-md-2"><input class="form-control" type="password" minlength="8" name="password" placeholder="Password" required></div>
<div class="col-md-3"><input class="form-control" name="full_name" placeholder="Full name" required></div>
<div class="col-md-3"><input class="form-control" name="email" placeholder="Email"></div>
<div class="col-md-1"><select class="form-select" name="role_id">{% for r in roles %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select></div>
<div class="col-md-1"><button class="btn btn-primary">Add</button></div>
</form></div></div>
<div class="card shadow-sm"><div class="card-body table-responsive"><table class="table"><thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.full_name}}</td><td>{{u.email or '-'}}</td><td>{{u.role_name}}</td><td>{{'Active' if u.is_active else 'Inactive'}}</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
